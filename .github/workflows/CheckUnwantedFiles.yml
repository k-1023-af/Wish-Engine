# Search Repository for unwanted files for GitHub Actions
name: CheckUnwantedFiles

on:
 # Make it possible to run it manually from GitHub Actions
 workflor_dispatch:
 # Also works when pushing to the master branch
 push:
  branches:
   - master

# Environment variables that define patterns for unwanted files to detect
# --- Important ----
# Patterns are specified separated by soaces

env:
 # specific file names and extensions
 UNWANTED_NAME PATTERS: "*.pdb *.ilk *.user *.ncb *.suo *.log *.dmp *.zip imgui.ini desktop.ini dxcompiler.dll dxil.dll"

 # Directory name patters (Build output folder etc)
 UNWANTED_DIR_PATTERNS: "generated x64 win32 arm64 .vs bin ipch logs Dump"

jobs:
 check-files:
  name: 不要なファイル検索
  runs-on: ubuntu-latest

  steps:
   - name: リポジトリをチェックアウト
     uses: actions/checkout@v6

   - name: 不要なファイルとディレクトリを検索 (bash)
     run: |
	# ディレクトリ条件を構築 (最初の不要な -o を後で削除)
	DIR_CONDITIONS=( )
	for pattern in $UNWANTED_DIR_PATTERNS; do
	DIR_CONDITIONS+=(-o -iname "$pattern")
	done
	unset DIR_CONDITIONS[0]

	# ディレクトリ条件を構築 (最初の不要な -o を後で削除)
	NAME_CONDITIONS=( )
	for pattern in $UNWANTED_DIR_PATTERNS; do
	DIR_CONDITIONS+=(-o -iname "$pattern")
	done
	unset DIR_CONDITIONS[0]

	# 1回の fine 実行で全件を検索
	# 1. .git　を除外
	# 2. 不要なディレクトリを検索(-type d)し、見つけたラパスを出力(-print)し、その中身を枝刈り(-prune)
	# 3. まだは ( -o ) 不要なファイルを検索(-type f)し、パスを出力(-print)
	UNWANTED_LIST=$(find . -path "./.git" -prune -o \
	\( \( "${DIR_CONDITIONS[@]}" \) -a -type d -print -prune \) -o \
	\( \( "${NAME_CONDITIONS[@]" \) -a -type f -print \) \
	)

	#検出結果があればエラーとして出力し、失敗させる
	if [ -n "$UNWANTED_LIST" ]; then
	 echo "::error::不要なファイルまたはディレクトリが見つかりました！"
	 echo "$UNWANTED_LIST"
	 exit 1
	fi

	echo "リポジトリはくりーんです。"